[package]
name = "interpolatable"
version = "1.2.0"
edition = "2021"
description = "Library for testing font interpolatability"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simoncozens/interpolatable"
exclude = ["/tests"]

[lib]
path = "src/lib.rs"

[features]
fontations = ["dep:skrifa"]

[dev-dependencies]
serde_json = "1.0"

[dependencies]
greencurves = "0.2.0"
kurbo = { workspace = true }
skrifa = { workspace = true, optional = true }
munkres = "0.5"
serde = { version = "1.0", features = ["derive"] }
itertools = "0.13"
fontdrasil = "1.0.0"
